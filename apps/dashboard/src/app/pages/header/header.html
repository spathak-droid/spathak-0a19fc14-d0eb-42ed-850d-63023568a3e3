<mat-toolbar
  color="primary"
  class="flex items-center justify-between px-6 py-2 shadow-md bg-gradient-to-r from-[#00bcd4] to-[#ff9800] text-white"
>
  <span
    class="flex items-center gap-2 font-semibold text-lg cursor-pointer"
    routerLink="/"
  >
    <mat-icon>task</mat-icon>
    {{ title }}
  </span>

  <!-- Logged-out -->
  @if (!auth.isLoggedIn()) {
    <a
      mat-stroked-button
      routerLink="/login"
      class="text-white border-white hover:bg-white hover:text-[#00bcd4] transition-all duration-200"
    >
      Login
    </a>
  }

  <!-- Logged-in -->
  @if (auth.isLoggedIn()) {
    <div class="flex items-center gap-6">

      <div class="flex flex-col text-right leading-tight">
        <span class="font-medium text-sm">
          {{ user?.name }}
        </span>

        <span class="text-xs opacity-80">
          {{ user?.organization?.name }}
        </span>

        <span class="text-[10px] opacity-70 italic">
          Role: {{ user?.role?.name }}
        </span>
      </div>


      <!-- Logout button -->
      <button
        mat-stroked-button
        class="text-white border-white hover:bg-white hover:text-[#00bcd4] transition-all duration-200"
        (click)="logout()"
      >
        Logout
      </button>

    </div>
  }
</mat-toolbar>
